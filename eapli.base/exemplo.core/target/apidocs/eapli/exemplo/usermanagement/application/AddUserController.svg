@startuml
    set namespaceSeparator none
    hide empty fields
    hide empty methods

    class "<size:14>AddUserController\n<size:10>eapli.exemplo.usermanagement.application" as eapli.exemplo.usermanagement.application.AddUserController [[AddUserController.html]] {
        -authz: AuthorizationService
        -userSvc: UserManagementService
        -utenteRepo: AiSafeUserRepository
        +getRoleTypes(): Role[]
        +addUser(String, String, String, String, String, Set<Role>, String, String, Email, SecurityClearance, LocalDate): User
    }

    center footer UMLDoclet 2.0.12, PlantUML 1.2020.16
@enduml

