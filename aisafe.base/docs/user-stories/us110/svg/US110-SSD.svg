roke-width:0.5;"/><path d="M121.0078,58.9883 L121.0078,85.9883 M108.0078,66.9883 L134.0078,66.9883 M121.0078,85.9883 L108.0078,100.9883 M121.0078,85.9883 L134.0078,100.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-tail" data-entity-uid="part1" data-qualified-name="OP" id="part1-tail"><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="226.0156" x="5" y="452.3711">Flight Control Operator</text><ellipse cx="121.0078" cy="465.0898" fill="#E3E3E3" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M121.0078,473.0898 L121.0078,500.0898 M108.0078,481.0898 L134.0078,481.0898 M121.0078,500.0898 L108.0078,515.0898 M121.0078,500.0898 L134.0078,515.0898" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-head" data-entity-uid="part2" data-qualified-name="SYS" id="part2-head"><rect fill="#E3E3E3" height="61.1094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.123" x="530.5576" y="63.9336"/><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="108.75" x="566.2441" y="90.2695">:Simulation</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="166.123" x="537.5576" y="113.8242">(flight_simulator)</text></g><g class="participant participant-tail" data-entity-uid="part2" data-qualified-name="SYS" id="part2-tail"><rect fill="#E3E3E3" height="61.1094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.123" x="530.5576" y="433.0352"/><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="108.75" x="566.2441" y="459.3711">:Simulation</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="166.123" x="537.5576" y="482.9258">(flight_simulator)</text></g><g><title>Flight Control Operator</title><rect fill="#FFFFFF" height="279.9922" style="stroke:#181818;stroke-width:1;" width="10" x="116.0078" y="136.043"/></g><g><title>.Simulation</title><rect fill="#FFFFFF" height="226.8828" style="stroke:#181818;stroke-width:1;" width="10" x="615.6191" y="189.1523"/></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="603.6191,185.1523,613.6191,189.1523,603.6191,193.1523,607.6191,189.1523" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="126.0078" x2="609.6191" y1="189.1523" y2="189.1523"/><text fill="#000000" font-family="sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="13.1934" x="133.0078" y="171.1563">1</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="200.1172" x="150.2012" y="159.3789">starts the simulation</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="412.334" x="150.2012" y="182.9336">(optionally with AISAFE_WIND="speed,dir")</text></g><path d="M388,202.1523 L388,282.1523 L853,282.1523 L853,212.1523 L843,202.1523 L388,202.1523" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M843,202.1523 L843,212.1523 L853,212.1523 L843,202.1523" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="302.1973" x="394" y="226.4883">environment thread loads wind</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="444.0137" x="394" y="250.043">and publishes it to shared memory each step;</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="421.8066" x="394" y="273.5977">flight processes drift laterally with the wind</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg2"><polygon fill="#181818" points="137.0078,313.3711,127.0078,317.3711,137.0078,321.3711,133.0078,317.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="131.0078" x2="614.6191" y1="317.3711" y2="317.3711"/><text fill="#000000" font-family="sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="13.1934" x="143.0078" y="311.1523">2</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="448.418" x="160.2012" y="311.1523">per-step progress with wind-drifted positions</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg3"><polygon fill="#181818" points="137.0078,374.4805,127.0078,378.4805,137.0078,382.4805,133.0078,378.4805" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="131.0078" x2="614.6191" y1="378.4805" y2="378.4805"/><text fill="#000000" font-family="sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="13.1934" x="143.0078" y="360.4844">3</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="410.3613" x="160.2012" y="348.707">real-time safety violations caused by wind</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="393.1836" x="160.2012" y="372.2617">(detected via the US102/US107 pipeline)</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg4"><polygon fill="#181818" points="132.0078,412.0352,122.0078,416.0352,132.0078,420.0352,128.0078,416.0352" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="126.0078" x2="619.6191" y1="416.0352" y2="416.0352"/><text fill="#000000" font-family="sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="13.1934" x="138.0078" y="409.8164">4</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="108.5645