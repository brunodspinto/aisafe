# AISafe Flight Simulation Configuration
# Lines starting with '#' are comments. Unknown keys are ignored.

# Air Control Area boundary in decimal degrees (Lisbon FIR)
aca_north=43.0
aca_south=36.0
aca_east=-6.0
aca_west=-10.0

# Number of flights to simulate (1 to 10)
# Note: only 4 flight plans are currently defined (FLIGHT_01 to FLIGHT_04)
n_flights=3

# Horizontal safety cylinder separation in nautical miles (converted to meters internally)
safe_dist_horiz_nm=8.0

# Vertical safety cylinder separation in meters
safe_dist_vert_m=600.0

# Number of safety violations before early termination
max_violations=5
